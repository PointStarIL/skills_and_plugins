<div id="bc" dir="rtl" style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;">
<h2 class="sr-only" style="position:absolute;left:-9999px">כרטיס אישור לשינוי שמות מסמכים, עם תיבת סימון לכל מסמך</h2>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
<div style="width:40px;height:40px;border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;font-size:20px;"><i class="ti ti-files" aria-hidden="true"></i></div>
<div style="flex:1;">
<p style="font-weight:500;font-size:16px;margin:0;">שינוי שמות מסמכים</p>
<p style="font-size:13px;color:var(--text-secondary);margin:0;">תיק 123 · הסרת הסיומת "(דמה)" מהתיאור ומשם הקובץ</p>
</div>
<span style="font-size:12px;padding:4px 10px;border-radius:var(--radius);background:var(--bg-warning);color:var(--text-warning);">תצוגה מקדימה</span>
</div>
<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);padding:6px 0;border-bottom:0.5px solid var(--border);cursor:pointer;"><input type="checkbox" id="all" checked onchange="tog(this.checked)">בחר הכול</label>
<div id="rows">
<label class="r" style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);cursor:pointer;"><input type="checkbox" data-id="6034" checked onchange="upd()" style="margin-top:4px"><span style="flex:1;min-width:0;"><span style="font-size:12px;color:var(--text-muted);">פעולה 6034 · מכתב נכנס · תיקיית משנה</span><br><span style="font-size:14px;color:var(--text-secondary);text-decoration:line-through;">תשובת חברת הביטוח (דמה)</span><br><span style="font-size:14px;font-weight:500;"><i class="ti ti-arrow-back-up" aria-hidden="true"></i> תשובת חברת הביטוח</span></span></label>
<label class="r" style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);cursor:pointer;"><input type="checkbox" data-id="6045" checked onchange="upd()" style="margin-top:4px"><span style="flex:1;min-width:0;"><span style="font-size:12px;color:var(--text-muted);">פעולה 6045 · מכתב יוצא · תיקיית משנה</span><br><span style="font-size:14px;color:var(--text-secondary);text-decoration:line-through;">חוות דעת רפואית ראשונה (דמה)</span><br><span style="font-size:14px;font-weight:500;"><i class="ti ti-arrow-back-up" aria-hidden="true"></i> חוות דעת רפואית ראשונה</span></span></label>
<label class="r" style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);cursor:pointer;"><input type="checkbox" data-id="6046" checked onchange="upd()" style="margin-top:4px"><span style="flex:1;min-width:0;"><span style="font-size:12px;color:var(--text-muted);">פעולה 6046 · מכתב נכנס · תיקיית משנה</span><br><span style="font-size:14px;color:var(--text-secondary);text-decoration:line-through;">סיכום מסמכים רפואיים (דמה)</span><br><span style="font-size:14px;font-weight:500;"><i class="ti ti-arrow-back-up" aria-hidden="true"></i> סיכום מסמכים רפואיים</span></span></label>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:10px 0;">לכל מסמך יעודכנו התיאור, שם הקובץ והנתיב, והמסד יגובה אוטומטית לפני הכתיבה.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button id="ok" onclick="go('אשר')" style="background:var(--fill-primary);color:var(--on-primary);border-color:transparent;font-weight:500;"></button>
<button onclick="sendPrompt('בטל את שינוי השמות')"><i class="ti ti-x" aria-hidden="true"></i> בטל ↗</button>
</div>
<p id="err" style="font-size:13px;color:var(--text-danger);margin:8px 0 0;display:none;">בחר לפחות מסמך אחד</p>
</div>
<script>
function ids(){return Array.prototype.slice.call(document.querySelectorAll('#rows input:checked')).map(function(c){return c.dataset.id})}
function upd(){var n=ids().length;document.getElementById('ok').innerHTML='<i class="ti ti-check" aria-hidden="true"></i> אשר '+n+' מסמכים ↗';document.getElementById('all').checked=(n===3);document.getElementById('err').style.display='none'}
function tog(v){document.querySelectorAll('#rows input').forEach(function(c){c.checked=v});upd()}
function go(){var a=ids();if(!a.length){document.getElementById('err').style.display='block';return}sendPrompt('אשר שינוי שמות למסמכים: '+a.join(', '))}
upd();
</script>
