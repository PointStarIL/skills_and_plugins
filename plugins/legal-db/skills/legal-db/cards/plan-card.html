<div id="pc" dir="rtl" style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;">
<h2 class="sr-only" style="position:absolute;left:-9999px">כרטיס אישור ליצירת אירוע ביומן</h2>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
<div style="width:40px;height:40px;border-radius:50%;background:var(--bg-success);color:var(--text-success);display:flex;align-items:center;justify-content:center;font-size:20px;"><i class="ti ti-calendar-event" aria-hidden="true"></i></div>
<div style="flex:1;min-width:0;">
<p style="font-weight:500;font-size:16px;margin:0;">יצירת אירוע: פגישה</p>
<p style="font-size:13px;color:var(--text-secondary);margin:0;">תיק 123 · שם הלקוח 123</p>
</div>
<span style="font-size:12px;padding:4px 10px;border-radius:var(--radius);background:var(--bg-warning);color:var(--text-warning);">תצוגה מקדימה, עוד לא נכתב</span>
</div>
<div style="border-top:0.5px solid var(--border);padding-top:10px;">
<table style="width:100%;font-size:14px;border-collapse:collapse;">
<tr><td style="color:var(--text-secondary);padding:5px 0;width:34%;">נושא</td><td style="padding:5px 0;">פגישת מעקב</td></tr>
<tr><td style="color:var(--text-secondary);padding:5px 0;">מועד</td><td style="padding:5px 0;">24.11.2026 · 10:00–10:30</td></tr>
<tr><td style="color:var(--text-secondary);padding:5px 0;">צבע ביומן</td><td style="padding:5px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fill-success);margin-left:6px;"></span>ירוק</td></tr>
<tr><td style="color:var(--text-secondary);padding:5px 0;">מוצר חיוב</td><td style="padding:5px 0;">פגישה (ללא חיוב בפועל)</td></tr>
<tr><td style="color:var(--text-secondary);padding:5px 0;">ייכתב ל</td><td style="padding:5px 0;font-size:13px;color:var(--text-secondary);">tblCaseAct, tblBasket</td></tr>
</table>
</div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;margin:12px 0;display:flex;flex-direction:column;gap:8px;">
<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;"><input type="checkbox" data-l="התראה 30 דקות לפני" checked>התראה 30 דקות לפני</label>
<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;"><input type="checkbox" data-l="הוספה ליומן" checked>הוספה ליומן (tblBasket)</label>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button onclick="go('אשר והרץ')" style="background:var(--fill-primary);color:var(--on-primary);border-color:transparent;font-weight:500;"><i class="ti ti-check" aria-hidden="true"></i> אשר והרץ ↗</button>
<button onclick="go('ערוך')"><i class="ti ti-edit" aria-hidden="true"></i> ערוך ↗</button>
<button onclick="go('בטל')"><i class="ti ti-x" aria-hidden="true"></i> בטל ↗</button>
</div>
</div>
<script>
function go(a){var o=[];document.querySelectorAll('#pc input[type=checkbox]').forEach(function(c){o.push(c.dataset.l+': '+(c.checked?'כן':'לא'))});sendPrompt(a+' (פגישה, תיק 123) | '+o.join(' ; '))}
</script>
